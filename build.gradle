plugins {
    id 'java-library'
    id 'signing'
    id 'maven-publish'
    id 'org.jreleaser' version '1.16.0'
}

group = 'net.deanly'
version = '0.1.2'
description = 'Solana Standard Development Kits for Java'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // SLF4J
    api 'org.slf4j:slf4j-api:2.0.16'

    // Struct Layout
    api 'net.deanly:struct-layout:0.3.5'

    // Internal Libraries
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.79'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.moshi:moshi:1.15.2'
    implementation 'com.squareup.moshi:moshi-adapters:1.15.2'

    // Compile Time
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Test
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.4.12'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.javassist:javassist:3.30.2-GA'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.4.12'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}

tasks.withType(Javadoc) { // Lombok 이슈로 인해 Javadoc을 비활성화
    enabled = false
}

tasks.named("build") {
    doFirst {
        file("$buildDir/jreleaser").mkdirs()
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name.set('solana-sdkj')
                description.set('Solana SDK for Java - A lightweight library for interacting with the Solana blockchain')
                url.set('https://github.com/deanly/solana-sdkj')
                inceptionYear.set('2025')
                licenses {
                    license {
                        name.set('MIT License')
                        url.set('https://opensource.org/licenses/MIT')
                    }
                }
                scm {
                    connection.set('scm:git:https://github.com/deanly/solana-sdkj.git')
                    developerConnection.set('scm:git:ssh://github.com/deanly/solana-sdkj.git')
                    url.set('https://github.com/deanly/solana-sdkj')
                }
                developers {
                    developer {
                        id.set('deanly')
                        name.set('Dean Lee')
                        email.set('deanly.dev@gmail.com')
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

signing {
    required { gradle.taskGraph.hasTask("publish") }
    sign publishing.publications.maven
}

jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }
    project {
        name = 'solana-sdkj'
        description = 'Solana RPC Methods for java'
        website = 'https://github.com/Deanly/solana-sdkj'
        license = 'MIT'
    }

    gitRootSearch = true
    release {
        github {
            enabled = true
            setRepoOwner('Deanly')
            name = 'solana-sdkj'
            tagName = 'v{{projectVersion}}'
            releaseName = '{{tagName}}'
        }
    }
}